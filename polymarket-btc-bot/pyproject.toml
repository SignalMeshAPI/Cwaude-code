[project]
name = "polymarket-btc-bot"
version = "0.1.0"
description = "7-phase Polymarket BTC 15-minute UP/DOWN trading bot"
requires-python = ">=3.11"
dependencies = [
    "py-clob-client>=0.20.0",
    "web3>=6.20.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "redis>=5.0.0",
    "prometheus-client>=0.20.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "structlog>=24.4.0",
    "typer>=0.12.0",
    "praw>=7.7.1",
    "vaderSentiment>=3.3.2",
    "tenacity>=9.0.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
pmbot = "polymarket_btc_bot.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polymarket_btc_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
